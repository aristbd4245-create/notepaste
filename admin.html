<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade" />
<title>NotePaste — Admin Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
  :root {
    --bg:#0a0e1a; --card:#1a1f2e; --card-hover:#232838;
    --border:#2a3142; --text:#e8ecf3; --text-dim:#8892a6;
    --accent:#3b82f6; --accent-2:#8b5cf6;
    --pink:#ec4899; --green:#10b981;
  }
  body {
    background:var(--bg); color:var(--text); min-height:100vh;
    font-size:15px; line-height:1.6;
    background-image:
      radial-gradient(circle at 0% 0%, rgba(59,130,246,0.08) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(139,92,246,0.08) 0%, transparent 40%);
  }
  a { color:var(--accent); text-decoration:none; }

  header {
    position:sticky; top:0; z-index:100;
    background:rgba(10,14,26,0.85);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px;
  }
  .logo {
    font-size:22px; font-weight:800; letter-spacing:-0.5px;
    background:linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    display:flex; align-items:center; gap:8px;
  }
  .logo::before { content:'⚡'; -webkit-text-fill-color:initial; font-size:20px; }
  nav { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  nav a {
    color:var(--text-dim); padding:8px 16px;
    border-radius:8px; font-weight:500; font-size:14px;
    transition:all 0.2s;
  }
  nav a:hover { color:var(--text); background:var(--card); }
  nav a.active {
    color:var(--text); background:var(--card);
    box-shadow:0 0 0 1px var(--border);
  }
  .user-email {
    font-size:13px; color:var(--green);
    background:rgba(16,185,129,0.1);
    padding:6px 12px; border-radius:8px;
    max-width:200px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }

  .container { max-width:960px; margin:0 auto; padding:32px 20px; }

  .hero { text-align:center; margin-bottom:24px; }
  .hero h1 {
    font-size:30px; font-weight:800; letter-spacing:-1px;
    margin-bottom:8px;
    background:linear-gradient(135deg, #fff, #8892a6);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero p { color:var(--text-dim); font-size:15px; }

  .stats {
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:12px; margin-bottom:24px;
  }
  .stat-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:16px; text-align:center;
  }
  .stat-card .num {
    font-size:28px; font-weight:800;
    background:linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .stat-card .label {
    font-size:12px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.5px;
    margin-top:4px;
  }

  .feed-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; flex-wrap:wrap; gap:12px;
  }
  .feed-header h2 {
    font-size:20px; font-weight:700;
    display:flex; align-items:center; gap:10px;
  }
  .live-dot {
    width:8px; height:8px; border-radius:50%; background:var(--green);
    animation: pulse 1.5s infinite;
    box-shadow:0 0 8px var(--green);
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(1.3); }
  }

  .search-mini {
    padding:8px 14px; background:var(--bg);
    border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-size:13px; outline:none;
    min-width:200px; font-family:inherit;
  }
  .search-mini:focus { border-color:var(--accent); }

  .note-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:18px 20px;
    margin-bottom:12px; cursor:pointer;
    transition:all 0.2s;
    animation: fadeIn 0.4s;
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }
  .note-card:hover {
    background:var(--card-hover);
    border-color:var(--accent);
    transform:translateX(4px);
  }
  .note-card-header {
    display:flex; justify-content:space-between;
    align-items:flex-start; gap:12px; margin-bottom:8px;
    flex-wrap:wrap;
  }
  .note-card-title {
    font-size:16px; font-weight:600; color:var(--text);
    word-break:break-word; flex:1;
  }
  .note-card-badge {
    padding:3px 10px; border-radius:6px;
    font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.5px;
    background:rgba(59,130,246,0.15); color:var(--accent);
  }
  .note-card-badge.mine {
    background:rgba(16,185,129,0.15); color:var(--green);
  }
  .note-card-preview {
    font-size:13px; color:var(--text-dim); line-height:1.5;
    margin-bottom:10px;
    font-family:'JetBrains Mono',monospace;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  .note-card-meta {
    display:flex; justify-content:space-between;
    align-items:center; gap:10px; flex-wrap:wrap;
    font-size:12px; color:var(--text-dim);
  }
  .note-card-actions { display:flex; gap:4px; }
  .icon-btn {
    background:var(--bg); border:1px solid var(--border);
    color:var(--text-dim); cursor:pointer;
    font-size:13px; padding:5px 10px;
    border-radius:6px; transition:all 0.2s;
    text-decoration:none;
  }
  .icon-btn:hover {
    background:var(--accent); color:white;
    border-color:var(--accent);
  }
  .icon-btn.danger:hover { background:#ef4444; border-color:#ef4444; }

  .empty {
    text-align:center; padding:50px 20px;
    color:var(--text-dim);
  }
  .empty .emoji { font-size:56px; display:block; margin-bottom:16px; }

  .loading {
    text-align:center; padding:30px;
    color:var(--accent); font-size:14px;
  }

  .toast {
    position:fixed; bottom:24px; right:24px;
    background:var(--card); border:1px solid var(--border);
    color:var(--text); padding:14px 20px;
    border-radius:10px; font-size:14px; font-weight:500;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    opacity:0; transform:translateY(20px);
    transition:all 0.3s; z-index:1000;
    display:flex; align-items:center; gap:10px;
    max-width:90vw;
  }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.success { border-color:var(--green); }
  .toast.error { border-color:#ef4444; }

  footer {
    text-align:center; padding:30px 20px;
    color:var(--text-dim); font-size:13px;
    border-top:1px solid var(--border);
    margin-top:40px;
  }

  .login-gate {
    position:fixed; inset:0; z-index:9999;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .login-gate.hidden { display:none; }
  .login-box {
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:36px 28px;
    max-width:420px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    animation: slideIn 0.4s;
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(20px) scale(0.96); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .login-icon { font-size:56px; margin-bottom:16px; display:block; }
  .login-title {
    font-size:22px; font-weight:800; margin-bottom:8px;
    background:linear-gradient(135deg, #fff, #8892a6);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .login-desc { font-size:14px; color:var(--text-dim); margin-bottom:24px; }
  .login-input {
    width:100%; padding:14px 16px;
    background:var(--bg); border:1px solid var(--border);
    border-radius:12px; color:var(--text);
    font-size:15px; font-family:inherit;
    outline:none; transition:all 0.2s;
    margin-bottom:12px;
  }
  .login-input:focus {
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(59,130,246,0.15);
  }
  .login-btn {
    width:100%; padding:14px 24px;
    border:none; border-radius:12px;
    font-size:15px; font-weight:700;
    font-family:inherit; cursor:pointer;
    background:linear-gradient(135deg, #3b82f6, #8b5cf6);
    color:white; box-shadow:0 4px 20px rgba(59,130,246,0.4);
    transition:all 0.2s;
    margin-top:4px;
  }
  .login-btn:hover:not(:disabled) {
    box-shadow:0 6px 28px rgba(59,130,246,0.6);
    transform:translateY(-1px);
  }
  .login-btn:disabled { opacity:0.6; cursor:not-allowed; }
  .login-error {
    color:#ef4444; font-size:13px;
    margin-top:12px; min-height:18px;
  }

  @media (max-width: 640px) {
    header { padding:12px 16px; }
    .logo { font-size:18px; }
    nav a { padding:6px 10px; font-size:13px; }
    .user-email { display:none; }
    .container { padding:20px 14px; }
    .hero h1 { font-size:24px; }
    .stats { grid-template-columns:1fr; }
    .note-card { padding:14px 16px; }
    .feed-header { flex-direction:column; align-items:stretch; }
    .search-mini { width:100%; }
    .login-box { padding:28px 20px; }
  }
</style>
</head>
<body>

<div class="login-gate" id="loginGate">
  <div class="login-box">
    <span class="login-icon">🔐</span>
    <div class="login-title">Admin Panel</div>
    <div class="login-desc">Masuk dengan akun admin Firebase</div>
    <input type="email" class="login-input" id="loginEmail"
           placeholder="email@gmail.com" autocomplete="username">
    <input type="password" class="login-input" id="loginPassword"
           placeholder="Password" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" id="loginBtn" onclick="tryLogin()">🔓 Masuk</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="adminContent" style="display:none;">

<header>
  <div class="logo">NotePaste Admin</div>
  <nav>
    <a href="admin.html" class="active">📋 Daftar Catatan</a>
    <a href="index.html">📤 Upload</a>
    <span class="user-email" id="userEmailDisplay"></span>
    <a href="#" onclick="logoutAdmin(); return false;">🚪 Logout</a>
  </nav>
</header>

<div class="container">

  <div class="hero">
    <h1>Panel Admin</h1>
    <p>Semua catatan yang pernah diupload ke NotePaste</p>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="num" id="totalNotes">0</div>
      <div class="label">Total Catatan</div>
    </div>
    <div class="stat-card">
      <div class="num" id="totalViews">0</div>
      <div class="label">Total Dilihat</div>
    </div>
    <div class="stat-card">
      <div class="num" id="totalLikes">0</div>
      <div class="label">Total Suka</div>
    </div>
  </div>

  <div class="feed-header">
    <h2>
      <span class="live-dot"></span>
      Semua Catatan
    </h2>
    <input type="text" class="search-mini" id="searchBox"
           placeholder="🔍 Cari catatan..." oninput="filterFeed()">
  </div>

  <div id="feedArea">
    <div class="loading">⏳ Memuat catatan...</div>
  </div>
</div>

<footer>
  &copy; 2025 NotePaste — Admin Panel
</footer>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBxc5eVejs3DTjyewW7adZorgFnJWSQbE",
  authDomain: "notepaste-306db.firebaseapp.com",
  databaseURL: "https://notepaste-306db-default-rtdb.firebaseio.com",
  projectId: "notepaste-306db",
  storageBucket: "notepaste-306db.firebasestorage.app",
  messagingSenderId: "157288885941",
  appId: "1:157288885941:web:9a00a5c7bcdd807b6798fc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let allNotes = [];
let filteredNotes = [];
let realtimeStarted = false;

/* ==================== LOGIN / LOGOUT ==================== */
window.tryLogin = function() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const error = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!email || !password) {
    error.textContent = '❌ Email dan password wajib diisi.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '⏳ Memproses...';
  error.textContent = '';

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      // onAuthStateChanged yang menangani tampilan
    })
    .catch((err) => {
      let msg = '❌ Email atau password salah.';
      if (err.code === 'auth/too-many-requests') {
        msg = '❌ Terlalu banyak percobaan. Coba lagi nanti.';
      } else if (err.code === 'auth/network-request-failed') {
        msg = '❌ Koneksi gagal. Periksa internet.';
      } else if (err.code === 'auth/invalid-api-key') {
        msg = '❌ apiKey salah. Periksa firebaseConfig.';
      } else if (err.code === 'auth/operation-not-allowed') {
        msg = '❌ Email/Password belum diaktifkan di Firebase.';
      }
      error.textContent = msg;
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginPassword').focus();
      btn.disabled = false;
      btn.innerHTML = '🔓 Masuk';
    });
};

window.logoutAdmin = function() {
  if (!confirm('Logout dari admin panel?')) return;
  signOut(auth).then(() => location.reload());
};

/* ==================== PANTAU STATUS LOGIN ==================== */
onAuthStateChanged(auth, (user) => {
  const gate = document.getElementById('loginGate');
  const content = document.getElementById('adminContent');
  const btn = document.getElementById('loginBtn');

  if (user) {
    gate.classList.add('hidden');
    content.style.display = 'block';
    document.getElementById('userEmailDisplay').textContent = user.email;
    startRealtime();
  } else {
    gate.classList.remove('hidden');
    content.style.display = 'none';
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '🔓 Masuk';
    }
    document.getElementById('loginEmail').focus();
  }
});

/* ==================== OWNER ID ==================== */
function getOwnerId() {
  try {
    let id = localStorage.getItem('notepaste_owner_id');
    if (!id) {
      id = 'owner_' + crypto.randomUUID().replace(/-/g, '');
      localStorage.setItem('notepaste_owner_id', id);
    }
    return id;
  } catch (e) {
    return 'owner_fallback';
  }
}
const MY_OWNER_ID = getOwnerId();

function isOwner(note) {
  return !!(note && note.ownerId && note.ownerId === MY_OWNER_ID);
}

/* ==================== UTILS ==================== */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : text;
  return div.innerHTML;
}
function formatDate(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Baru saja';
  if (mins < 60) return mins + ' menit lalu';
  const hours = Math.floor(diff / 3600000);
  if (hours < 24) return hours + ' jam lalu';
  const days = Math.floor(diff / 86400000);
  if (days < 7) return days + ' hari lalu';
  return d.toLocaleString('id-ID', {
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  const icon = type === 'error' ? '⚠️' : '✅';
  t.innerHTML = '<span>' + icon + '</span><span>' + escapeHtml(msg) + '</span>';
  t.className = 'toast show ' + (type === 'error' ? 'error' : 'success');
  setTimeout(function() { t.className = 'toast'; }, 2500);
}

/* ==================== RENDER ==================== */
function updateStats() {
  const total = allNotes.length;
  const views = allNotes.reduce(function(sum, n) { return sum + (n.views || 0); }, 0);
  const likes = allNotes.reduce(function(sum, n) { return sum + (n.likes || 0); }, 0);
  document.getElementById('totalNotes').textContent = total;
  document.getElementById('totalViews').textContent = views;
  document.getElementById('totalLikes').textContent = likes;
}

function renderFeed() {
  const area = document.getElementById('feedArea');

  if (filteredNotes.length === 0) {
    area.innerHTML = '<div class="empty"><span class="emoji">📭</span><p>' +
      (allNotes.length === 0 ? 'Belum ada catatan sama sekali.' : 'Tidak ada yang cocok.') +
      '</p></div>';
    return;
  }

  area.innerHTML = filteredNotes.map(function(n) {
    const preview = (n.content || '').substring(0, 140).replace(/\n/g, ' ');
    const badge = isOwner(n)
      ? '<span class="note-card-badge mine">✓ Milik Anda</span>'
      : '<span class="note-card-badge">' + escapeHtml(n.lang || 'text') + '</span>';
    return '<div class="note-card" onclick="openNote(\'' + n.id + '\')">' +
      '<div class="note-card-header">' +
        '<div class="note-card-title">' + escapeHtml(n.title) + '</div>' +
        badge +
      '</div>' +
      '<div class="note-card-preview">' + escapeHtml(preview) + '</div>' +
      '<div class="note-card-meta">' +
        '<span>📅 ' + formatDate(n.createdAt) + ' • 👁️ ' + (n.views || 0) + 'x • ❤️ ' + (n.likes || 0) + '</span>' +
        '<div class="note-card-actions">' +
          '<button class="icon-btn" title="Copy Link" onclick="event.stopPropagation();copyNoteLink(\'' + n.id + '\')">📋</button>' +
          '<button class="icon-btn danger" title="Hapus" onclick="event.stopPropagation();deleteNote(\'' + n.id + '\')">🗑️</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

window.filterFeed = function() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  if (!q) {
    filteredNotes = allNotes;
  } else {
    filteredNotes = allNotes.filter(function(n) {
      return (n.title || '').toLowerCase().includes(q) ||
             (n.content || '').toLowerCase().includes(q);
    });
  }
  renderFeed();
};

window.openNote = function(id) {
  window.open('view.html?id=' + id, '_blank');
};

window.copyNoteLink = function(id) {
  const link = location.origin + location.pathname.replace('admin.html', '') + 'view.html?id=' + id;
  navigator.clipboard.writeText(link)
    .then(function() { showToast('Link disalin!', 'success'); })
    .catch(function() { showToast('Gagal copy', 'error'); });
};

/* ==================== HAPUS ==================== */
window.deleteNote = async function(id) {
  if (!auth.currentUser) {
    showToast('Harus login dulu', 'error');
    return;
  }
  if (!confirm('Hapus catatan ini?')) return;
  try {
    await remove(ref(db, 'notes/' + id));
    showToast('Catatan dihapus', 'success');
  } catch (err) {
    console.error(err);
    showToast('Gagal hapus: ' + err.message, 'error');
  }
};

/* ==================== REALTIME ==================== */
function startRealtime() {
  if (realtimeStarted) return;
  realtimeStarted = true;
  const notesRef = ref(db, 'notes');
  onValue(notesRef, function(snapshot) {
    const now = Date.now();
    if (!snapshot.exists()) {
      allNotes = [];
    } else {
      const data = snapshot.val();
      allNotes = Object.values(data)
        .filter(function(n) { return !n.expiresAt || n.expiresAt > now; })
        .sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    }
    updateStats();
    filterFeed();
  }, function(error) {
    document.getElementById('feedArea').innerHTML =
      '<div class="empty"><span class="emoji">⚠️</span><p>Gagal memuat: ' +
      escapeHtml(error.message) + '</p></div>';
  });
}
</script>

</body>
</html>.
